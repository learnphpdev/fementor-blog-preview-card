<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main class="bg">
      <article class="card">
        <img class="card-cover" src="assets/images/illustration-article.svg" alt="Article cover">
        <div class="tags"><span>Learning</span></div>
        <time class="date" datetime="2023-12-21">Published 21 Dec 2023</time>
        <h1>
          <a href="#">HTML & CSS foundations</a>
        </h1>
        <p class="excerpt">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <section class="author">
          <img src="assets/images/image-avatar.webp" alt="Author image avatar" />
          <span>Greg Hooper</span>
        </section>
      </article>
    </main>

    <footer class="attribution">
      <p>
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >. Coded by <a href="#">Joy</a>.
      </p>
    </footer>
  </body>
</html>
